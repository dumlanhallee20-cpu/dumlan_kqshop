<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop | KQ Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop">
  <main class="container page">
    <h1 class="display page-title" id="shop-title">All Shoes</h1>

    <div class="toolbar">
      <div class="tabs" id="shop-tabs"></div>
      <select class="select" id="sort" aria-label="Sort by">
        <option value="featured">Sort by: Featured</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
      </select>
    </div>

    <div class="product-grid" id="shop-grid"></div>
  </main>
  <!-- Order matters: data first, then store, then ui, then the page code -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
